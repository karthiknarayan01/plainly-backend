name: Deploy to GCP

# dev is the live branch (same convention as the other repos) — every
# push here redeploys. main only ever advances via the promotion PR, so
# it intentionally does not trigger a deploy on its own.
on:
  push:
    branches: [dev]

env:
  PROJECT_ID: plainly-backend-440007
  REGION: us-central1

permissions:
  id-token: write # required for Workload Identity Federation — no stored key
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/529271112301/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: plainly-deployer@plainly-backend-440007.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # All four builds and all four deploys are independent of each
      # other (if: always(), each gated only on its own build's
      # outcome via steps.build_x.outcome) so one service failing —
      # writer-model running out of disk, judge/writer still blocked on
      # GPU quota, worker crash-looping — can't skip or hide whether
      # the other three succeeded.

      - name: Build and push API image
        id: build_api
        if: always()
        run: |
          IMAGE=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/plainly/api:${{ github.sha }}
          docker build -t "$IMAGE" services/api
          docker push "$IMAGE"
          echo "API_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Build and push worker image
        id: build_worker
        if: always()
        run: |
          IMAGE=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/plainly/worker:${{ github.sha }}
          docker build -t "$IMAGE" services/worker
          docker push "$IMAGE"
          echo "WORKER_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Build and push writer-model image
        id: build_writer
        if: always()
        run: |
          IMAGE=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/plainly/writer-model:${{ github.sha }}
          docker build -t "$IMAGE" services/writer-model
          docker push "$IMAGE"
          echo "WRITER_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Build and push judge-model image
        id: build_judge
        if: always()
        run: |
          IMAGE=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/plainly/judge-model:${{ github.sha }}
          docker build -t "$IMAGE" services/judge-model
          docker push "$IMAGE"
          echo "JUDGE_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy API to Cloud Run
        if: always() && steps.build_api.outcome == 'success'
        run: |
          gcloud run deploy plainly-api \
            --image="$API_IMAGE" \
            --region="${{ env.REGION }}" \
            --project="${{ env.PROJECT_ID }}"

      - name: Deploy worker to Cloud Run
        if: always() && steps.build_worker.outcome == 'success'
        run: |
          gcloud run deploy plainly-worker \
            --image="$WORKER_IMAGE" \
            --region="${{ env.REGION }}" \
            --project="${{ env.PROJECT_ID }}"

      - name: Deploy writer-model to Cloud Run
        if: always() && steps.build_writer.outcome == 'success'
        run: |
          gcloud run deploy plainly-writer-model \
            --image="$WRITER_IMAGE" \
            --region="${{ env.REGION }}" \
            --project="${{ env.PROJECT_ID }}"

      - name: Deploy judge-model to Cloud Run
        if: always() && steps.build_judge.outcome == 'success'
        run: |
          gcloud run deploy plainly-judge-model \
            --image="$JUDGE_IMAGE" \
            --region="${{ env.REGION }}" \
            --project="${{ env.PROJECT_ID }}"
