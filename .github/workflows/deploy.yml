name: Deploy to GCP

# dev is the live branch (same convention as the other repos) — every
# push here redeploys. main only ever advances via the promotion PR, so
# it intentionally does not trigger a deploy on its own.
on:
  push:
    branches: [dev]

env:
  PROJECT_ID: plainly-backend-440007
  REGION: us-central1

permissions:
  id-token: write # required for Workload Identity Federation — no stored key
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/529271112301/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: plainly-deployer@plainly-backend-440007.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push API image
        run: |
          IMAGE=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/plainly/api:${{ github.sha }}
          docker build -t "$IMAGE" services/api
          docker push "$IMAGE"
          echo "API_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Build and push worker image
        run: |
          IMAGE=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/plainly/worker:${{ github.sha }}
          docker build -t "$IMAGE" services/worker
          docker push "$IMAGE"
          echo "WORKER_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy API to Cloud Run
        run: |
          gcloud run deploy plainly-api \
            --image="$API_IMAGE" \
            --region="${{ env.REGION }}" \
            --project="${{ env.PROJECT_ID }}"

      - name: Deploy worker to Cloud Run
        run: |
          gcloud run deploy plainly-worker \
            --image="$WORKER_IMAGE" \
            --region="${{ env.REGION }}" \
            --project="${{ env.PROJECT_ID }}"
