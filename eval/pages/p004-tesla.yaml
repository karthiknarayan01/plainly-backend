original_page: "# Tesla — Q2 2026 (quarter ended June 30, 2026)\n\n\n## Headline\
  \ results\n\nTotal revenue $28.236 billion, +26% Y/Y — first quarter Tesla has\n\
  crossed $100 billion in trailing-twelve-month revenue.\n\n## Segment breakdown\n\
  \n- Automotive revenue: $20.516 billion (+23%)\n- Services and Other: $4.58 billion\
  \ (+50%), all-time record gross profit\n of $648 million at 14% gross margin\n\
  - Energy: $3.14 billion (+13%)\n\n## Margins\n\nTotal GAAP gross margin 16.8%\
  \ (-41bps Y/Y). Automotive gross margin\n16.9%, or 16.3% excluding regulatory\
  \ credits — down from 19.2% in Q1\n2026; roughly flat excluding a $230 million\
  \ Q1 benefit that didn't\nrepeat.\n\n## Profitability\n\nOperating income $398\
  \ million, down 57% Y/Y; operating margin narrowed\nto 1.4%.\n\n## Note\n\nThis\
  \ file covers Q2 2026 financial results specifically. A separate,\nearlier release\
  \ (production/delivery report) covers unit volumes — worth\nknowing since Tesla\
  \ splits these into two different documents, unlike\nthe other four companies\
  \ here which report volume and financial figures\ntogether."
