original_page: "# Alphabet — Q2 2026 (quarter ended June 30, 2026)\n\n\n## Headline\
  \ results\n\nConsolidated revenues $119.8 billion, +24% Y/Y (+23% constant currency)\n\
  — the 12th consecutive quarter of double-digit revenue growth.\n\n## Segment breakdown\n\
  \n- Google Services: $94.5 billion (+15% Y/Y)\n - Google Search & other: $63.3\
  \ billion (+17%)\n - YouTube ads: $11.1 billion (+13%)\n - Subscriptions, platforms,\
  \ devices: $12.9 billion (+15%)\n- Google Cloud: $24.8 billion (+82% Y/Y) — acceleration\
  \ driven by\n enterprise AI Solutions and enterprise AI Infrastructure\n- Other\
  \ Bets: $382 million\n\n## Profitability\n\nOperating income $40.8 billion (+30%\
  \ Y/Y); operating margin 34%\n(+2 percentage points). Net income available to\
  \ common stockholders\n$112.1 billion (+298% Y/Y); diluted EPS $9.11 (+294% Y/Y)\
  \ — the\nextraordinary net income jump reflects $98.0 billion in other income,\n\
  primarily unrealized gains on equity securities.\n\n## CEO commentary\n\nSundar\
  \ Pichai: \"AI investments are redefining what's possible across\nevery part of\
  \ our business.\" Cited 82% Google Cloud growth, ~90% of\nFortune 100 using Gemini\
  \ Enterprise, 22 billion Gemini API tokens\nprocessed per minute, 950 million\
  \ Gemini App monthly active users.\n\n## Capital allocation & balance sheet\n\n\
  Raised $49.6 billion via equity issuance in June 2026. Established a\n$40.0 billion\
  \ At-the-Market program (unutilized as of June 30). Issued\n$20.3 billion in senior\
  \ unsecured notes. Quarterly dividend $0.22/common\nshare; preferred dividend\
  \ $12.15/share (~$0.60/depositary share).\n\n## Cash flow\n\nYTD operating cash\
  \ flow $84.9 billion; capex $80.6 billion; trailing\ntwelve-month free cash flow\
  \ $53.3 billion (Q2 alone was negative,\n-$5.9 billion, due to elevated AI-infrastructure\
  \ capex)."
