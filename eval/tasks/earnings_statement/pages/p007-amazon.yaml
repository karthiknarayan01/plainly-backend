original_page: "# Amazon — Q2 2026 (quarter ended June 30, 2026)\n\n\n## Headline\
  \ results\n\nNet sales of $200.6 billion, up 20% year-over-year. Operating income\
  \ of\n$27.5 billion, up 43% year-over-year. Net income of $62.6 billion, or\n\
  $5.75 per diluted share, up sharply from $18.2 billion ($1.68/share) in\nQ2 2025.\n\
  \n## Segment performance\n\n- North America: $116.2B net sales (+16% Y/Y); operating\
  \ income $9.1B\n (vs. $7.5B prior year)\n- International: $42.2B net sales (+15%\
  \ Y/Y); operating income $1.7B\n (vs. $1.5B prior year)\n- AWS: $42.2B net sales\
  \ (+37% Y/Y); operating income $16.6B (vs. $10.2B\n prior year); $169B annualized\
  \ revenue run rate\n\n## CEO commentary\n\nAndy Jassy: \"AWS is booming, growing\
  \ 36.7% year-over-year in Q2 — our\nfastest growth in 18 quarters.\" AI and Chips\
  \ businesses each exceeded\n$25 billion run rates.\n\n## Growth drivers\n\nAI\
  \ infrastructure investment — specifically Trainium chip commitments\nfrom Anthropic\
  \ and OpenAI — drove AWS expansion. Advertising grew 26%\nyear-over-year. Same-day\
  \ or overnight Prime deliveries exceeded 40% of\nitems in the first half of the\
  \ year. Amazon Bedrock expanded to hundreds\nof thousands of customers; Q2 spending\
  \ on it exceeded all prior quarters\ncombined.\n\n## Q3 2026 guidance\n\nNet sales\
  \ of $197.0–202.0 billion (9–12% Y/Y growth). Operating income\nof $22.5–26.5\
  \ billion, versus $17.4 billion in Q3 2025."
