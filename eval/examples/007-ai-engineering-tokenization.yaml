id: "007-ai-engineering-tokenization"
source_type: technical_book
source: >
  Chip Huyen, "AI Engineering" (O'Reilly, 2024), Chapter 1, tokenization
  section. See eval/sources/README.md for copyright handling — short
  excerpt only, not the full chapter. good_rewrite is the user's own
  commissioned rewrite, provided as the target style/quality bar for the
  writing model, not generated by us.

original_excerpt: >
  The basic unit of a language model is token. A token can be a
  character, a word, or a part of a word (like -tion), depending on the
  model. For example, GPT-4, a model behind ChatGPT, breaks the phrase
  "I can't wait to build AI applications" into nine tokens. Note that in
  this example, the word "can't" is broken into two tokens, can and 't.

  The process of breaking the original text into tokens is called
  tokenization. For GPT-4, an average token is approximately ¾ the
  length of a word. So, 100 tokens are approximately 75 words.

  The set of all tokens a model can work with is the model's vocabulary.
  You can use a small number of tokens to construct a large number of
  distinct words, similar to how you can use a few letters in the
  alphabet to construct many words. The Mixtral 8x7B model has a
  vocabulary size of 32,000. GPT-4's vocabulary size is 100,256. The
  tokenization method and vocabulary size are decided by model
  developers.

good_rewrite: >
  The basic unit that a language model works with is called a token. A
  token can be a single character, a whole word, or a piece of a word,
  such as the fragment -tion, and which of these it is depends entirely
  on the model. GPT-4, one of the models behind ChatGPT, breaks the
  phrase "I can't wait to build AI applications" into nine tokens. Look
  closely at that example and you will notice something slightly odd:
  the word "can't" is not one token but two, can and 't.

  The act of chopping the original text into tokens is called
  tokenization. For GPT-4, an average token works out to roughly three
  quarters of the length of a word, so a rough rule of thumb you can
  carry around in your head is that 100 tokens comes to about 75 words.

  The full set of tokens that a model is able to work with is called
  that model's vocabulary. Here is the pleasant thing about a
  vocabulary: a fairly small number of tokens can be combined to
  construct an enormous number of distinct words, in exactly the same
  way that twenty-six letters of the alphabet can be shuffled around to
  build every word in the dictionary. The Mixtral 8x7B model has a
  vocabulary of 32,000 tokens. GPT-4's vocabulary is 100,256 tokens.
  Both the tokenization method and the vocabulary size are decisions
  made by the people who build the model; they are not laws of nature.

good_rewrite_rationale: >
  Every number survives exactly (nine tokens, ¾, 100/75, 32,000,
  100,256). Keeps the "-tion" and "can't" examples concrete rather than
  abstracting them away. The "twenty-six letters of the alphabet" line
  is the original's own analogy, just spelled out — not a new one
  invented by the rewrite, so it stays faithful while still reading as
  more vivid. "They are not laws of nature" at the end is a light
  editorializing touch, but it's a fair restatement of the original's
  flat "decided by model developers" — it doesn't add a claim, it just
  underlines the one that's already there (these are human choices, not
  physics). This is a case where a rewrite can sound more opinionated
  than the source without actually saying anything the source didn't.

bad_rewrite: >
  Language models break text into tokens, which can be characters,
  words, or subwords. GPT-4 tokenizes "I can't wait to build AI
  applications" into 9 tokens. The tokenization ratio is about 0.75
  words per token. Vocabulary size varies by model — Mixtral 8x7B has
  32K tokens, GPT-4 has over 100K. Model developers choose the
  tokenization scheme and vocab size during pretraining.

bad_rewrite_rationale: >
  Keeps the numbers but loses everything that made them usable: the
  alphabet analogy is gone, so "vocabulary" is left as a bare term
  instead of an intuitive idea, and "100 tokens ≈ 75 words" (a number a
  reader can use directly) is replaced with "0.75 words per token" (a
  ratio the reader now has to do math with). "Tokenization ratio",
  "subwords", and "vocab" are unexplained jargon for a 10th-grade reader
  with no technical background — worse, "tokenization ratio" isn't a
  term the original excerpt uses at all. Most importantly, "during
  pretraining" is a specific technical claim about *when* these
  decisions get made that the original excerpt never states — this is
  a fabricated detail dressed up as a faithful technical clarification,
  exactly the kind of "gain" that reads as more informative while
  actually being unsupported by the source.
