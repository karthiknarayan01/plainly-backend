bad_rewrite_rationale: >
  This is the actual output the production pipeline generated for this
  exact page, and the judge scored it fidelity=7, overall=8,
  approved=true — despite every one of these problems: (1) every single
  page number is gone, so the table of contents can no longer do its job
  of letting the reader find a section; (2) nearly every title is
  paraphrased into a fabricated-sounding heading instead of reproduced
  verbatim ("Embedding Model Architecture" -> "How Embedding Models
  Work", "Diarization" -> "Separating Different Speakers in Audio"); (3)
  "NIMs," an actual NVIDIA product name, is expanded into "Neural Network
  Model Packaging (NIMs)" — an invented, unverified guess at what the
  acronym stands for, presented as fact; (4) it opens with a leaked
  meta-commentary preamble ("Here's the rewritten passage in plain
  language:") that the reader would see verbatim. By the rubric's
  structural-content rule, dozens of entries are affected — this is
  "multiple meaningful violations," the 0-3 fidelity band, not 7.
