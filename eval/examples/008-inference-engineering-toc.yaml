good_rewrite_rationale: >
  Every section number, title, and page number is preserved exactly —
  nothing renamed, nothing paraphrased, nothing dropped. "NIMs" (an
  actual NVIDIA product name, not a term to translate) stays "NIMs"
  rather than being expanded into an invented guess. The only change is
  reformatting from dotted-leader table style into a clean list — that's
  a legitimate simplification for a table of contents, since the reader's
  job here is to find and navigate to a section, not to have prose
  explained to them.

