source: >
  Real user-uploaded PDF, "Inference Engineering," table of contents
  entries spanning Chapters 6-7. Sourced directly from a real production
  job (job f0081b63, chunk 8) after the user reported the app's output
  was "absolutely horrible" for a real document — this exact original
  text and bad_rewrite are what the pipeline actually produced, not a
  synthesized worst case. No eval example previously covered structural/
  reference content (tables of contents, indices) at all, which is why
  this failure mode shipped undetected.

