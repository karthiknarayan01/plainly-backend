id: "006-ai-engineering-scale-intro"
source_type: technical_book
source: >
  Chip Huyen, "AI Engineering" (O'Reilly, 2024), Chapter 1, opening
  paragraphs. See eval/sources/README.md for copyright handling — short
  excerpt only, not the full chapter. good_rewrite is the user's own
  commissioned rewrite, provided as the target style/quality bar for the
  writing model, not generated by us.

original_excerpt: >
  If I could use only one word to describe AI post-2020, it'd be scale.
  The AI models behind applications like ChatGPT, Google's Gemini, and
  Midjourney are at such a scale that they're consuming a nontrivial
  portion of the world's electricity, and we're at risk of running out
  of publicly available internet data to train them.

  The scaling up of AI models has two major consequences. First, AI
  models are becoming more powerful and capable of more tasks, enabling
  more applications. More people and teams leverage AI to increase
  productivity, create economic value, and improve quality of life.

  Second, training large language models (LLMs) requires data, compute
  resources, and specialized talent that only a few organizations can
  afford. This has led to the emergence of model as a service: models
  developed by these few organizations are made available for others to
  use as a service. Anyone who wishes to leverage AI to build
  applications can now use these models to do so without having to
  invest up front in building a model.

good_rewrite: >
  If somebody stopped me in the street and gave me exactly one word to
  describe what has happened to artificial intelligence since the year
  2020, I would not hesitate for even a second, and the word I would
  pick is scale. Everything about modern AI is big in a way that is hard
  to hold in your head. The models sitting behind the applications you
  already know, things like ChatGPT, Google's Gemini, and Midjourney,
  have grown so enormous that they now eat up a portion of the world's
  electricity that nobody can wave away as a rounding error, and,
  stranger still, we are running into a wall that almost nobody saw
  coming a decade ago, which is that we are close to running out of
  publicly available text on the internet to feed them. Think about
  that for a moment. Humanity has been writing things down on the
  internet for thirty years, blogs and forums and news articles and
  arguments and recipes and code, and we have nearly finished pouring
  all of it into these machines.

  This growing up of AI models has had two big consequences, and it is
  worth sitting with both of them, because almost everything else in
  this book flows out of them.

  The first consequence is a happy one. AI models have become more
  powerful, and, more importantly, they have become capable of doing
  more different kinds of things. A model that can do more things opens
  the door to more applications, and more applications means more
  people and more teams reaching for AI to get their work done faster,
  to create real economic value, and to make daily life a little better
  than it was.

  The second consequence is a more complicated one. Training a large
  language model, which people usually shorten to LLM, takes an amount
  of data, an amount of computing power, and a kind of rare specialized
  talent that only a small handful of organizations on the planet can
  actually afford. That single fact has shaped the entire industry.
  Because so few can build these models, a new arrangement appeared,
  which people call model as a service: the few organizations that can
  build the models make them available to everyone else to use, the way
  a power company makes electricity available without asking you to
  build a dam. Anyone who wants to use AI to build something can now
  simply reach for one of these existing models, and they can do it
  without spending a single rupee or dollar up front on building a
  model of their own.

good_rewrite_rationale: >
  Every fact survives: the electricity concern, the risk of running out
  of internet training data, both consequences of scale, and all three
  resources needed to train an LLM (data, compute, specialized talent —
  the original bad_rewrite below is written to drop one of these). The
  dam/power-company analogy for "model as a service" is new phrasing but
  faithfully expands the original's own metaphor ("available for others
  to use as a service") rather than replacing it with something
  unrelated. One thing worth naming explicitly: "without spending a
  single rupee or dollar" adds a word ("rupee") that isn't in the
  original at all. This is a style choice, not a fidelity violation — it
  doesn't assert any new fact, just pairs a familiar-to-some-readers
  currency alongside "dollar" as a rhetorical flourish. This is the
  boundary the judge has to draw correctly: stylistic color that adds no
  claim is fine; a specific new claim dressed as color (see 003-microsoft)
  is not.

bad_rewrite: >
  AI has gotten really big since 2020. Models like ChatGPT, Gemini, and
  Midjourney use a lot of electricity and computing power to run. Big AI
  models are expensive to build, so only large companies can afford to
  build them. This led to a business model called model-as-a-service,
  where these companies rent out access to their models via APIs.
  Anyone can now build AI apps by calling these APIs instead of training
  their own model.

bad_rewrite_rationale: >
  Drops the internet-data-scarcity risk entirely — a real claim in the
  original, gone with no trace (loss). Collapses "data, compute
  resources, and specialized talent" down to just "expensive," silently
  dropping specialized talent as a named bottleneck (another loss).
  Introduces "APIs" twice, completely unexplained — a direct violation
  of the judge's no-unexplained-jargon check for a reader with no
  technical background, and worse, the term isn't even in the original
  excerpt at all, so this is jargon the rewrite invented rather than
  jargon it failed to simplify. A rewrite can be shorter and still lose
  nothing; this one is shorter because it drops things.
