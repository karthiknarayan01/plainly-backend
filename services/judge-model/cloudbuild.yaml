# Built via Cloud Build, not the GitHub Actions runner — same reasoning
# as services/writer-model/cloudbuild.yaml, though this 8B model is much
# smaller (~19min end to end on this config, confirmed by testing).
steps:
  - name: "gcr.io/cloud-builders/docker"
    args: ["build", "-t", "${_IMAGE}", "."]
images:
  - "${_IMAGE}"
options:
  machineType: "E2_HIGHCPU_32"
  diskSizeGb: 150
timeout: 2400s
substitutions:
  _IMAGE: "us-central1-docker.pkg.dev/plainly-backend-440007/plainly/judge-model:latest"
